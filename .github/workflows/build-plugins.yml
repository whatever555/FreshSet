name: Build Saturday Plugin

on:
  push:
    branches: [main]
    tags: ["plugin-v*", "v*"]
    paths:
      - "saturday/plugin/**"
      - ".github/workflows/build-plugins.yml"
  pull_request:
    branches: [main]
    paths:
      - "saturday/plugin/**"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Universal)
            platform: macos
            cmake_generator: Ninja
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
            build_targets: Saturday_VST3 Saturday_AU
            setup: brew install ninja
          - os: windows-latest
            label: Windows (x64)
            platform: windows
            cmake_generator: Ninja
            cmake_extra: ""
            build_targets: Saturday_VST3
            setup: echo "Using preinstalled MSVC"
          - os: ubuntu-22.04
            label: Linux (x64)
            platform: linux
            cmake_generator: Ninja
            cmake_extra: ""
            build_targets: Saturday_VST3
            setup: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                build-essential ninja-build pkg-config \
                libasound2-dev libjack-jackd2-dev ladspa-sdk \
                libcurl4-openssl-dev libfreetype6-dev \
                libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
                libxinerama-dev libxrandr-dev libxrender-dev \
                libgl1-mesa-dev libglu1-mesa-dev \
                libwebkit2gtk-4.0-dev

    defaults:
      run:
        working-directory: saturday/plugin

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: ${{ matrix.setup }}

      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.cmake_generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DSATURDAY_COPY_AFTER_BUILD=OFF
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel --target ${{ matrix.build_targets }}

      - name: Package
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ matrix.platform }}" build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturday-${{ matrix.platform }}
          path: saturday/plugin/dist/Saturday-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release zips
        run: |
          mkdir -p release-assets
          find artifacts -name 'Saturday-*.zip' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Saturday-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
