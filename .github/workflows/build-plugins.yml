name: Build Saturday Plugin

on:
  push:
    branches: [main]
    tags: ["plugin-v*", "v*"]
  pull_request:
    branches: [main]
    paths:
      - "saturday/plugin/**"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Universal)
            platform: macos
            build_targets: Saturday_VST3 Saturday_AU
          - os: windows-2022
            label: Windows (x64)
            platform: windows
            build_targets: Saturday_VST3
          - os: ubuntu-24.04
            label: Linux (x64)
            platform: linux
            build_targets: Saturday_VST3

    defaults:
      run:
        working-directory: saturday/plugin

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      - name: Install Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install ninja -y

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config git \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev \
            libgtk-3-dev libxi-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -G Xcode \
            -DSATURDAY_COPY_AFTER_BUILD=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSATURDAY_COPY_AFTER_BUILD=OFF

      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSATURDAY_COPY_AFTER_BUILD=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel --target ${{ matrix.build_targets }}

      - name: Package
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ matrix.platform }}" build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturday-${{ matrix.platform }}
          path: saturday/plugin/dist/Saturday-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release zips
        run: |
          mkdir -p release-assets
          find artifacts -name 'Saturday-*.zip' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Saturday ${{ github.ref_name }}
          files: release-assets/Saturday-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
