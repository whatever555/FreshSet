name: Build Saturday Plugin

on:
  push:
    branches: [main]
    tags: ["plugin-v*", "v*"]
  pull_request:
    branches: [main]
    paths:
      - "saturday/plugin/**"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (Universal)
    runs-on: macos-14
    defaults:
      run:
        working-directory: saturday/plugin
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G Xcode \
            -DSATURDAY_COPY_AFTER_BUILD=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel --target Saturday_VST3 Saturday_AU

      - name: Package
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh macos build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturday-macos
          path: saturday/plugin/dist/Saturday-macos.zip
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    continue-on-error: true
    defaults:
      run:
        working-directory: saturday/plugin
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DSATURDAY_COPY_AFTER_BUILD=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel --target Saturday_VST3

      - name: Package
        shell: pwsh
        run: bash scripts/package-release.sh windows build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturday-windows
          path: saturday/plugin/dist/Saturday-windows.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        working-directory: saturday/plugin
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libxi-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev \
            libegl1-mesa-dev libwebkit2gtk-4.0-dev

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DSATURDAY_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --parallel --target Saturday_VST3

      - name: Package
        run: ./scripts/package-release.sh linux build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saturday-linux
          path: saturday/plugin/dist/Saturday-linux.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Saturday-macos
          path: release-assets

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Saturday-windows
          path: release-assets

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Saturday-linux
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Saturday ${{ github.ref_name }}
          body: |
            Pre-built Saturday Saturation Shaper plugins.

            | Download | Platform | Contents |
            |----------|----------|----------|
            | `Saturday-macos.zip` | macOS (Apple Silicon + Intel) | VST3 + AU |
            | `Saturday-windows.zip` | Windows 64-bit | VST3 |
            | `Saturday-linux.zip` | Linux 64-bit | VST3 |

            Unzip and copy the plugin to your DAW's plug-in folder. See [saturday/plugin/README.md](https://github.com/whatever555/FreshSet/blob/main/saturday/plugin/README.md) for install paths.
          files: release-assets/Saturday-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
